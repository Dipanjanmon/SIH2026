<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical Bot — Chat + Voice</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI','Noto Sans Bengali',sans-serif; }
  body { background:#022c22; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
  .app { width:480px; max-width:100%; background:#14532d; border-radius:20px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .head { background:linear-gradient(135deg,#065f46,#059669); padding:14px 20px; display:flex; align-items:center; gap:12px; }
  .avatar { width:42px; height:42px; background:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; }
  .head h1 { color:#fff; font-size:17px; }
  .head p { color:#a7f3d0; font-size:11px; }
  .tools { display:flex; gap:8px; padding:10px 20px; background:#14532d; justify-content:center; border-bottom:1px solid #166534; }
  .tool-btn { background:#166534; border:none; color:#bbf7d0; padding:6px 14px; border-radius:14px; cursor:pointer; font-size:12px; }
  .tool-btn:hover { background:#059669; color:#fff; }
  .chat { padding:18px; height:420px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; background:#022c22; }
  .msg { max-width:88%; padding:10px 14px; border-radius:16px; font-size:14px; line-height:1.6; }
  .user { align-self:flex-end; background:#065f46; color:#fff; border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:#166534; color:#ecfdf5; border-bottom-left-radius:4px; }
  .med { align-self:flex-start; background:#1e3a8a; color:#dbeafe; border-bottom-left-radius:4px; font-size:12px; }
  .bot .badge { font-size:10px; color:#6ee7b7; display:block; margin-bottom:4px; }
  .read-btn { display:inline-block; margin-top:8px; background:#022c22; border:1px solid #34d399; color:#6ee7b7; padding:5px 12px; border-radius:12px; font-size:12px; cursor:pointer; }
  .read-btn:hover { background:#059669; color:#fff; }
  .read-btn.playing { background:#dc2626; color:#fff; border-color:#dc2626; }
  .typing { display:none; align-self:flex-start; background:#166534; padding:12px 16px; border-radius:16px; }
  .typing span { width:7px; height:7px; background:#a7f3d0; border-radius:50%; display:inline-block; animation:blink 1.4s infinite; }
  .typing span:nth-child(2){ animation-delay:.2s; } .typing span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink { 0%,80%,100%{opacity:.2;} 40%{opacity:1;} }
  .inputbar { display:flex; padding:12px; background:#14532d; gap:8px; border-top:1px solid #166534; }
  .inputbar input { flex:1; padding:12px 14px; border:none; border-radius:24px; background:#022c22; color:#fff; font-size:14px; outline:none; }
  .inputbar input::placeholder{ color:#6ee7b7; }
  .inputbar button { background:#059669; color:#fff; border:none; border-radius:50%; width:44px; height:44px; font-size:18px; cursor:pointer; }
  .note { padding:8px 20px; background:#14532d; color:#6ee7b7; font-size:11px; text-align:center; }
  .note b { color:#fbbf24; }
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div class="avatar">🩺</div>
    <div>
      <h1>ঢাকার মেডিকেল বট</h1>
      <p>চিকিৎসা তথ্য সহকারী • Real-time চ্যাট • পুরনো session ফেরানো</p>
    </div>
  </div>

  <div class="tools">
    <button class="tool-btn" onclick="recover()">♻️ Session ফেরাও</button>
    <button class="tool-btn" onclick="clearSess()">🗑️ Session মুছো</button>
    <button class="tool-btn" onclick="viewHist()">📋 ইতিহাস</button>
  </div>

  <div class="chat" id="chat"></div>
  <div class="typing" id="typing"><span></span><span></span><span></span></div>

  <div class="inputbar">
    <input id="inp" placeholder="উদাহরণ: মাথা ব্যথা করছে..." autocomplete="off">
    <button onclick="send()">➤</button>
  </div>

  <div class="note"><b>⚠️ জরুরি:</b> বট doctor নয় — সাধারণ তথ্য। গুরুতর হলে হাসপাতাল/৯৯৯। প্রতিটা উত্তরে 🔊 Read = ভয়েস।</div>
</div>

<script>
const chat=document.getElementById('chat'), typing=document.getElementById('typing'), inp=document.getElementById('inp');
let tone='male', curBtn=null, curAudio=null, uid='uid_'+(Date.now().toString(36));

function addMsg(text,who,lang,med=false){
  const div=document.createElement('div'); div.className='msg '+who+(med?' med':'');
  if(who==='bot'){
    div.innerHTML='<span class="badge">🩺 স্বাস্থ্য সহকারী</span>'+text;
    const b=document.createElement('button'); b.className='read-btn'; b.textContent='🔊 Read';
    b.onclick=()=>speak(text,b,lang); div.appendChild(b);
  } else div.textContent=text;
  chat.appendChild(div); chat.scrollTop=chat.scrollHeight;
}
function guessLang(t){
  for(const c of t){const p=c.codePointAt(0); if(p>=0x0980&&p<=0x09FF)return'bn'; if(p>=0x0900&&p<=0x097F)return'hi';}
  return /kemon|bhalo|ami|tumi|vai|bhai|ache|hobe|korbo|korchi/i.test(t)?'bn':'en';
}

async function send(){
  const m=inp.value.trim(); if(!m)return;
  const lang=guessLang(m);
  addMsg(m,'user',lang);
  inp.value=''; typing.style.display='block'; chat.scrollTop=chat.scrollHeight;
  let reply=null;
  try{
    const res=await fetch('http://localhost:5000/medical/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({q:m, tone, uid})});
    if(res.ok){ const d=await res.json(); reply=d.reply; }
  }catch(e){}
  typing.style.display='none';
  if(reply) addMsg(reply,'bot',lang,true);
  else addMsg('⚠️ Server এ connect হয়নি। `main.py`/`start_smartbot.bat` দিয়ে server চালু আছে কিনা দেখো।','bot','en');
}

async function recover(){
  typing.style.display='block';
  try{
    const res=await fetch('http://localhost:5000/session/recover?uid='+uid);
    const d=await res.json();
    typing.style.display='none';
    addMsg(d.recovered ? '✅ আগের session ফেরানো হয়েছে! উপরের বার্তাগুলো আবার দেখা যাবে...' : '❌ কোনো মুছে ফেলা session পাওয়া যায়নি।','bot','bn');
    if(d.recovered && d.history){
      for(const m of d.history){
        addMsg(m.content, m.role==='user'?'user':'bot', 'bn', m.role==='assistant');
      }
    }
  }catch(e){ typing.style.display='none'; addMsg('⚠️ Server connect হয়নি।','bot','en'); }
}
async function clearSess(){
  try{
    await fetch('http://localhost:5000/session/clear?uid='+uid);
    addMsg('🗑️ Session মুছে ফেলা হয়েছে। এখনও recover করা যাবে।','bot','bn');
  }catch(e){ addMsg('⚠️ Server connect হয়নি।','bot','en'); }
}
async function viewHist(){
  try{
    const res=await fetch('http://localhost:5000/medical/history?uid='+uid);
    const d=await res.json();
    addMsg('📋 বর্তমান session-এ '+d.count+' লাইন কথা আছে।','bot','bn');
  }catch(e){ addMsg('⚠️ Server connect হয়নি।','bot','en'); }
}

function speak(text, btn, lang){
  const wasPlaying=(btn===curBtn);
  if(curAudio){ curAudio.pause(); curAudio=null; }
  if(curBtn){ curBtn.classList.remove('playing'); curBtn.textContent='🔊 Read'; curBtn=null; }
  if(wasPlaying) return;
  const fetchSpeak=()=>{
    fetch('http://localhost:5000/speak?q='+encodeURIComponent(text)+'&tone='+tone, {signal:AbortSignal.timeout(8000)})
      .then(r=>r.ok?r.arrayBuffer():Promise.reject())
      .then(buf=>{
        const url=URL.createObjectURL(new Blob([buf],{type:'audio/mpeg'}));
        const a=new Audio(url); a.onended=()=>{ btn.classList.remove('playing'); btn.textContent='🔊 Read'; curAudio=null; curBtn=null; URL.revokeObjectURL(url); };
        a.onerror=()=>synth();
        a.play().catch(()=>synth());
        curAudio=a; curBtn=btn; btn.classList.add('playing'); btn.textContent='⏹️ Stop';
      }).catch(()=>synth());
  };
  const synth=()=>{
    try{
      const u=new SpeechSynthesisUtterance(text);
      u.lang=lang==='bn'?'bn-BD':lang==='hi'?'hi-IN':'en-IN';
      u.onend=()=>{ btn.classList.remove('playing'); btn.textContent='🔊 Read'; curAudio=null; curBtn=null; };
      speechSynthesis.speak(u); btn.classList.add('playing'); btn.textContent='⏹️ Stop';
    }catch(e){ btn.classList.remove('playing'); btn.textContent='🔊 Read'; }
  };
  fetchSpeak();
}

inp.addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
addMsg('🩺 আসসালামু আলাইকুম! আমি মেডিকেল সহকারী। মাথা ব্যথা, জ্বর, পেট ব্যথা — যেকোনো স্বাস্থ্য প্রশ্ন করুন বাংলায়। আমি সাধারণ তথ্য + ঘরোয়া ব্যবস্থা + ডাক্তার দেখার সময় বলবো। এটা আসল ডাক্তারি পরামর্শ নয়।','bot','bn');
</script>
</body>
</html>

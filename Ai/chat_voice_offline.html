<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartBot Pro — Chat + Neural Voice (Offline)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI','Noto Sans Bengali',sans-serif; }
  body { background:#0f172a; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
  .app { width:460px; max-width:100%; background:#1e293b; border-radius:20px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .head { background:linear-gradient(135deg,#7c3aed,#db2777); padding:14px 20px; display:flex; align-items:center; gap:12px; }
  .avatar { width:42px; height:42px; background:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; }
  .head h1 { color:#fff; font-size:17px; }
  .head p { color:#fce7f3; font-size:11px; }
  .tonebar { display:flex; gap:8px; padding:10px 20px; background:#1e293b; justify-content:center; border-bottom:1px solid #334155; }
  .tone-btn { background:#334155; border:none; color:#94a3b8; padding:6px 14px; border-radius:14px; cursor:pointer; font-size:12px; }
  .tone-btn.active { background:#7c3aed; color:#fff; }
  .chat { padding:18px; height:400px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; background:#0f172a; }
  .msg { max-width:88%; padding:10px 14px; border-radius:16px; font-size:14px; line-height:1.6; }
  .user { align-self:flex-end; background:#2563eb; color:#fff; border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:#334155; color:#f1f5f9; border-bottom-left-radius:4px; }
  .bot .badge { font-size:10px; color:#a78bfa; display:block; margin-bottom:4px; }
  .read-btn { display:inline-block; margin-top:8px; background:#1e293b; border:1px solid #475569; color:#38bdf8; padding:5px 12px; border-radius:12px; font-size:12px; cursor:pointer; }
  .read-btn:hover { background:#0ea5e9; color:#fff; }
  .read-btn.playing { background:#ef4444; color:#fff; border-color:#ef4444; }
  .typing { display:none; align-self:flex-start; background:#334155; padding:12px 16px; border-radius:16px; }
  .typing span { width:7px; height:7px; background:#94a3b8; border-radius:50%; display:inline-block; animation:blink 1.4s infinite; }
  .typing span:nth-child(2){ animation-delay:.2s; } .typing span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink { 0%,80%,100%{opacity:.2;} 40%{opacity:1;} }
  .inputbar { display:flex; padding:12px; background:#1e293b; gap:8px; border-top:1px solid #334155; }
  .inputbar input { flex:1; padding:12px 14px; border:none; border-radius:24px; background:#0f172a; color:#fff; font-size:14px; outline:none; }
  .inputbar input::placeholder{ color:#64748b; }
  .inputbar button { background:#7c3aed; color:#fff; border:none; border-radius:50%; width:44px; height:44px; font-size:18px; cursor:pointer; }
  .controls { display:flex; gap:14px; padding:10px 20px; background:#1e293b; border-top:1px solid #334155; }
  .controls div { flex:1; text-align:center; }
  .controls small { color:#94a3b8; font-size:10px; display:block; }
  .controls input { width:100%; accent-color:#7c3aed; }
  .note { padding:8px 20px; background:#1e293b; color:#64748b; font-size:11px; text-align:center; }
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div class="avatar">🤖</div>
    <div>
      <h1>SmartBot Pro</h1>
      <p>Chat + Neural Voice • 100% অফলাইন</p>
    </div>
  </div>

  <div class="tonebar">
    <button class="tone-btn active" onclick="setTone('male')">🧔 Male</button>
    <button class="tone-btn" onclick="setTone('female')">👩 Female</button>
  </div>

  <div class="chat" id="chat"></div>
  <div class="typing" id="typing"><span></span><span></span><span></span></div>

  <div class="inputbar">

    <button onclick="send()">➤</button>
  </div>

function guessLang(t){
  // Script detection
  for(const c of t){const p=c.codePointAt(0); if(p>=0x0980&&p<=0x09FF)return'bn'; if(p>=0x0900&&p<=0x097F)return'hi'; if(p>=0x0600&&p<=0x06FF)return'ur';}
  const w = t.toLowerCase();
  // Banglish keywords
  const bn = /\b(kemon|obostha|korcho|bolo|valo|bhalo|dhonyobad|ami|tumi|apni|kotha|chakri|tokar|poysa|mon|vai|bhai|korte|lagbe|korbo|koro|likhi|likhte|hobe|acha|thik|ache|ase|sobar|ki|na|ar)\b/;
  // Hinglish keywords
  const hi = /\b(main|tum|kaise|kya|hai|kaam|chahiye|naam|acha|badiya|shukriya|bolo|batao|madad|sawal|sabse|apna|apni|kuch|karo|karne|hoga|tha|hum|aap|kaun|kyun|kab)\b/;
  const bnl = (w.match(bn)||[]).length;
  const hil = (w.match(hi)||[]).length;
  if(bnl>0 && bnl>=hil) return 'bn';
  if(hil>0) return 'hi';
  return 'en';
}

function getReply(msg){
  const lang=guessLang(msg);
  for(const k of KB){ if(k.m.test(msg)) return {text:k[lang]||k.bn, lang}; }
  // Smart offline fallback: recognize question intent keywords
  const w = msg.toLowerCase();
  const defs = [
    { re:/\?/, t: lang==='bn' ? "ভালো প্রশ্ন! আরেকটু খোলসা করে বলো — ক্যারিয়ার, কোডিং, টাকা, ইন্টারভিউ, পড়া নাকি স্বাস্থ্য — কোনটা?" : lang==='hi' ? "अच्छा सवाल! थोड़ा और साफ़ बताओ — करियर, कोडिंग, पैसा, इंटरव्यू, पढ़ाई या सेहत?" : "Good question! Could you be a bit more specific — career, coding, money, interview, study, or health?" },
    { re:/কী|কি|কোন|how|what|which|why|kaise|kya|ki\b/, t: lang==='bn' ? "বলো, ঠিক কোন বিষয়ে জানতে চাও? আমি ক্যারিয়ার, কোডিং, টাকা, ইন্টারভিউ, পড়াশোনা আর মানসিক স্বাস্থ্য — সবেতেই সাহায্য করতে পারি।" : lang==='hi' ? "बताओ किस विषय में? करियर, कोडिंग, पैसा, इंटरव्यू, पढ़ाई या मानसिक सेहत — सबमें मदद कर सकता हूं।" : "Tell me the topic — career, coding, money, interview, study, or mental health — I can help with all." }
  ];
  for(const d of defs){ if(d.re.test(w)) return {text:d.t, lang}; }
  return {text: lang==='bn' ? "হুম, আরেকটু খুলে বলো — পূর্ণটা শুনে উত্তর দিতে চাই।" : lang==='hi' ? "हां, थोड़ा और बताइए।" : "Hmm, tell me a bit more so I can help properly.", lang};
}

async function getSmartReply(msg){
  // AI (OpenRouter/Gemini) via server — no hardcoded KB
  let data = null;
  try {
    const res = await fetch('http://localhost:5000/chat?q='+encodeURIComponent(msg)+'&tone='+tone, {signal: AbortSignal.timeout(20000)});
    if(res.ok) data = await res.json();
  } catch(e){ data = null; }
  if(data && data.reply){
    return { text: data.reply, lang: data.lang || guessLang(msg) };
  }
  // Server unreachable or AI failed — show clear message, never fake KB answer
  const L = guessLang(msg);
  const msgOffline = L==='bn'
    ? "⚠️ এখন AI-তে connect হয়নি। নিশ্চিত করো `main.py` বা `start_smartbot.bat` চালিয়ে server চালু আছে, তারপর আবার চেষ্টা করো।"
    : L==='hi'
    ? "⚠️ अभी AI से कनेक्ट नहीं हुआ। सुनिश्चित करें कि सर्वर चल रहा है (main.py / start_smartbot.bat), फिर दोबारा कोशिश करें।"
    : "⚠️ Couldn't reach the AI. Make sure the server is running (main.py or start_smartbot.bat), then try again.";
  return { text: msgOffline, lang: L };
}

function setTone(t){ tone=t; document.querySelectorAll('.tone-btn').forEach(b=>b.classList.remove('active')); document.querySelectorAll('.tone-btn').forEach(b=>{ if(b.textContent.includes(t==='male'?'Male':'Female')) b.classList.add('active'); }); }

function speak(text, btn, lang){
  const wasPlaying = (btn === curBtn);
  if(curAudio){ curAudio.pause(); curAudio=null; }
  if(curBtn){ curBtn.classList.remove('playing'); curBtn.textContent = curBtn.dataset.lbl || '🔊 Read'; curBtn=null; }
  if(wasPlaying){ return; }
  const spd=parseFloat(document.getElementById('spd').value);
  const pch=parseFloat(document.getElementById('pch').value);
  const tryServer = () => {
    fetch('http://localhost:5000/speak?q='+encodeURIComponent(text)+'&tone='+tone, {signal: AbortSignal.timeout(8000)})
      .then(r => { if(!r.ok) throw new Error('http'); return r.arrayBuffer(); })
      .then(buf => {
        const blob = new Blob([buf], {type:'audio/mpeg'});
        const url = URL.createObjectURL(blob);
        const a = new Audio(url);
        a.playbackRate = spd; a.preservesPitch = false;
        a.onended = () => { btn.classList.remove('playing'); btn.textContent='🔊 Read'; curAudio=null; curBtn=null; URL.revokeObjectURL(url); };
        a.onerror = () => fallback();
        a.play().catch(() => fallback());
        curAudio=a; curBtn=btn; btn.dataset.lbl='🔊 Read'; btn.classList.add('playing'); btn.textContent='⏹️ Stop';
      })
      .catch(() => fallback());
  };
  const fallback = () => {
    const a = new Audio(VOICE[tone][lang]);
    a.playbackRate = spd; a.preservesPitch = false;
    a.onended = () => { btn.classList.remove('playing'); btn.textContent='🔊 Read'; curAudio=null; curBtn=null; };
    a.onerror = () => synth();
    a.play().catch(() => synth());
    curAudio=a; curBtn=btn; btn.classList.add('playing'); btn.textContent='⏹️ Stop';
  };
  const synth = () => {
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang==='bn' ? 'bn-BD' : lang==='hi' ? 'hi-IN' : 'en-IN';
      u.rate = spd; u.pitch = 1 + pch;
      const v = speechSynthesis.getVoices().find(x => x.lang === u.lang);
      if(v) u.voice = v;
      btn.classList.add('playing'); btn.textContent='⏹️ Stop';
      u.onend = () => { btn.classList.remove('playing'); btn.textContent='🔊 Read'; curAudio=null; curBtn=null; };
      speechSynthesis.speak(u);
    } catch(e) { btn.classList.remove('playing'); btn.textContent='🔊 Read'; }
  };
  tryServer();
}

function addMsg(text,who,lang){
  const div=document.createElement('div'); div.className='msg '+who;
  if(who==='bot'){
    div.innerHTML='<span class="badge">🎗️ SmartBot · '+tone+'</span>'+text;
    const b=document.createElement('button'); b.className='read-btn'; b.textContent='🔊 Read';
    b.onclick=()=>speak(text,b,lang); div.appendChild(b);
  } else div.textContent=text;
  chat.appendChild(div); chat.scrollTop=chat.scrollHeight;
}

async function send(){
  const m=inp.value.trim(); if(!m)return;
  const lang=guessLang(m);
  addMsg(m,'user');
  inp.value=''; typing.style.display='block'; chat.scrollTop=chat.scrollHeight;
  const r=await getSmartReply(m);
  typing.style.display='none';
  addMsg(r.text,'bot',r.lang||lang);
}
inp.addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });

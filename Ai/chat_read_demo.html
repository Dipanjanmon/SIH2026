<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartBot Pro — Professional AI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Noto Sans Bengali', sans-serif; }
  body { background: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .app { width: 460px; max-width: 100%; background: #1e293b; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .header { background: linear-gradient(135deg, #4f46e5, #0ea5e9); padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
  .avatar { width: 42px; height: 42px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .header h1 { color: #fff; font-size: 18px; }
  .header p { color: #dbeafe; font-size: 12px; }
  .pro-bar { display: flex; gap: 8px; padding: 10px 20px; background: #1e293b; justify-content: center; border-bottom: 1px solid #334155; }
  .pro-btn { background: #334155; border: none; color: #94a3b8; padding: 7px 16px; border-radius: 14px; cursor: pointer; font-size: 13px; }
  .pro-btn.active { background: #4f46e5; color: #fff; }
  .chat { padding: 20px; height: 420px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #0f172a; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.6; }
  .user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: #334155; color: #f1f5f9; border-bottom-left-radius: 4px; }
  .bot .badge { font-size: 10px; color: #818cf8; display: block; margin-bottom: 4px; }
  .read-btn { display: inline-block; margin-top: 8px; background: #1e293b; border: 1px solid #475569; color: #38bdf8; padding: 5px 12px; border-radius: 12px; font-size: 12px; cursor: pointer; }
  .read-btn:hover { background: #0ea5e9; color: #fff; }
  .read-btn.speaking { background: #ef4444; color: #fff; border-color: #ef4444; }
  .typing { display: none; align-self: flex-start; background: #334155; padding: 12px 16px; border-radius: 16px; }
  .typing span { width: 7px; height: 7px; background: #94a3b8; border-radius: 50%; display: inline-block; animation: blink 1.4s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100% { opacity: 0.2; } 40% { opacity: 1; } }
  .input-bar { display: flex; padding: 12px; background: #1e293b; gap: 8px; border-top: 1px solid #334155; }
  .input-bar input { flex: 1; padding: 12px 14px; border: none; border-radius: 24px; background: #0f172a; color: #fff; font-size: 14px; outline: none; }
  .input-bar input::placeholder { color: #64748b; }
  .input-bar button { background: #4f46e5; color: #fff; border: none; border-radius: 50%; width: 44px; height: 44px; font-size: 18px; cursor: pointer; }
  .demo-tags { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 12px 0; background: #1e293b; }
  .demo-tags span { background: #334155; color: #94a3b8; padding: 5px 10px; border-radius: 12px; font-size: 11px; cursor: pointer; }
  .demo-tags span:hover { background: #475569; color: #fff; }
  .note { padding: 10px 20px; background: #1e293b; color: #64748b; font-size: 11px; text-align: center; border-top: 1px solid #334155; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="avatar">🧠</div>
    <div>
      <h1 id="bot-name">SmartBot Pro</h1>
      <p>প্রফেশনাল এডভাইজার • বাংলা हिंदी English</p>
    </div>
  </div>

  <div class="pro-bar">

    <span>"কোডিং শেখার রোডম্যাপ"</span>
    <span>"টাকার বুদ্ধি / ব্যবসা"</span>
    <span>"চাকরি ইন্টারভিউ"</span>
  </div>

  <div class="chat" id="chat"></div>
  <div class="typing" id="typing"><span></span><span></span><span></span></div>

  <div class="input-bar">
    <input id="input" placeholder="প্রশ্ন লিখো — যেকোনো বিষয় ইংরেজি/বাংলা/হিন্দিতে..." autocomplete="off">
    <button onclick="send()">➤</button>
  </div>

  <div class="note">🧠 ইন্টেলিজেন্ট এনজিন — বিষয় বুঝে প্রফেশনাল উত্তর • 🔊 Read</div>
</div>

function detectLang(msg) {
  if (/[\u0980-\u09FF]/.test(msg)) return 'bn';
  if (/[\u0900-\u097F]/.test(msg)) return 'hi';
  return 'en';
}

function getReply(msg) {
  const lang = detectLang(msg);
  for (let k of KNOWLEDGE) {
    if (k.match.test(msg)) return k[lang] || k.bn;
  }
  if (lang === 'bn')
    return "🤔 আমি এখনো এই বিষয়ে উত্তর লিখিনি, তবে জানতে চাই — প্রশ্নটা আরেকটু বিস্তারে বলো?\n\nপরিশ্রমের সাথে আমি বিষয়টা analysis করে উত্তর দেবো। বিকল্প: কোড, ক্যারিয়ার, টাকা, ইন্টারভিউ, স্বাস্থ্য, মন — এই বিষয়ে ask করো।";
  if (lang === 'hi')
    return "🤔 मुझे थोड़ा और संदर्भ चाहिए. आपका सवाल विस्तार से बताइए, मैं विश्लेषण करके जवाब दूंगा।";
  return "🤔 Give me a bit more context — expand your question and I'll give a structured, professional answer. Or ask about career, coding, money, interviews, health, or mindset.";
}

function speak(text, btn) {
  if (activeSpeak && activeSpeak.stop) { activeSpeak.stop(); activeSpeak = null; }
  const btnClean = () => { btn.classList.remove('speaking'); btn.textContent = '🔊 Read'; };
  const lang = detectLang(text).replace('hi','bn');
  const audio = new Audio('https://translate.google.com/translate_tts?ie=UTF-8&q=' + encodeURIComponent(text) + '&tl=' + (detectLang(text)) + '&client=tw-ob');
  activeSpeak = audio;
  btn.classList.add('speaking');
  btn.textContent = '⏹️ Stop';
  audio.onended = () => { btnClean(); activeSpeak = null; };
  audio.onerror = () => { btnClean(); speakLocal(text, btn); };
  audio.play().catch(() => { btnClean(); speakLocal(text, btn); });
  btn.onclick = () => { audio.pause(); audio.currentTime = 0; btnClean(); activeSpeak = null; };
}

function speakLocal(text, btn) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = detectLang(text) === 'hi' ? 'hi-IN' : detectLang(text) === 'bn' ? 'bn-BD' : 'en-US';
    u.rate = 0.95;
    u.pitch = 1.05;
    const voices = speechSynthesis.getVoices();
    const v = voices.find(x => x.lang === u.lang) || voices.find(x => x.lang.startsWith(u.lang.slice(0,2)));
    if (v) u.voice = v;
    btn.classList.add('speaking');
    btn.textContent = '⏹️ Stop';
    u.onend = () => { btn.classList.remove('speaking'); btn.textContent = '🔊 Read'; activeSpeak = null; };
    speechSynthesis.speak(u);
  } catch (e) {
    btn.classList.remove('speaking');
    btn.textContent = '🔊 Read';
  }
}

function addMsg(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  if (who === 'bot') {
    div.innerHTML = '<span class="badge">🧠 ' + STYLE[currentTone].name + '</span>' + text.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
    const btn = document.createElement('button');
    btn.className = 'read-btn';
    btn.textContent = '🔊 Read';
    btn.onclick = () => speak(text, btn);
    div.appendChild(btn);
  } else {
    div.textContent = text;
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function setTone(tone) {
  currentTone = tone;
  document.querySelectorAll('.pro-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.pro-btn').forEach(b => { if (b.textContent.includes(tone === 'neutral' ? 'Professional' : tone === 'male' ? 'Male' : 'Female')) b.classList.add('active'); });
}

function send() {
  const msg = input.value.trim();
  if (!msg) return;
  addMsg(msg, 'user');
  input.value = '';
  typing.style.display = 'block';
  chat.scrollTop = chat.scrollHeight;
  setTimeout(() => {
    typing.style.display = 'none';
    addMsg(getReply(msg), 'bot');
  }, 600);
}

input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

document.querySelectorAll('.demo-tags span').forEach(tag => {
  tag.addEventListener('click', () => { input.value = tag.textContent.trim(); send(); });
});

version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: pashuraksha_db
    environment:
      POSTGRES_DB: pashuraksha
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: pashuraksha_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pashuraksha.local
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:

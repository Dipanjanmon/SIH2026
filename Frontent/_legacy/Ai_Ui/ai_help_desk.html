<!DOCTYPE html>
<html lang="en-IN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PashuSahaya &mdash; AI Help Desk UI Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="ai_help_desk.css">
</head>
<body class="min-h-screen bg-slate-100">
    <div class="p-6">
        <div class="mx-auto max-w-3xl rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <div class="flex items-center gap-3">
                <img src="../img/icon/Neural_Knights.jpeg" alt="NSDC" class="h-11 w-11 rounded-lg object-cover">
                <div>
                    <div class="text-sm font-bold text-slate-800">PashuSahaya AI Help Desk &mdash; Standalone Preview</div>
                    <div class="text-xs text-slate-500">Widget floats bottom-right. Dashboard mixture: opens from the circular FAB.</div>
                </div>
            </div>
            <div class="mt-4 rounded-lg border border-blue-100 bg-blue-50 px-3 py-2 text-xs text-blue-700">
                Shared: <code>ai_help_desk.css</code> (styles) + <code>ai_help_desk.js</code> (widget logic, injected markup) + icons from <code>img/icon/</code>.
            </div>
        </div>
    </div>
    <script src="ai_help_desk.js"></script>
</body>
</html>
